name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install websockets pillow
      - run: python3 tests/test_obs_golive.py
      - run: python3 tests/test_obs_micwatch.py
      - run: python3 tests/test_obs_sceneswitch.py
      - run: python3 tests/test_mevo_watch.py
      - run: python3 tests/test_install.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 tests/test_mevo_relay.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning install.sh bin/pixy-tune bin/mevo-relay
      - name: Python scripts compile
        run: for f in bin/obsctl bin/obs-golive bin/obs-micwatch bin/obs-sceneswitch bin/mevo-watch bin/pixy-track; do python3 -m py_compile "$f"; done
