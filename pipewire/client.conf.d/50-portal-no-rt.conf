# Keep PipeWire's realtime module out of xdg-desktop-portal's own connections.
#
# Every OpenPipeWireRemote call makes the portal open a new PipeWire context.
# Without real-time privileges, that context's module-rt asks for its thread
# priority over D-Bus, and by default it asks org.freedesktop.portal.Desktop:
# the portal process itself, which is still busy with the call that started
# all this. When several captures start at once (OBS loading five window
# captures), those calls block one another until libdbus gives up at 25 s,
# and OBS has already timed out on every capture but one.
#
# The portal hands each connection to the app and closes its own end, so it
# never needs realtime scheduling. Every other client keeps module-rt.
#
# Goes in ~/.config/pipewire/client.conf.d/. PipeWire reads it each time the
# portal opens a connection, so nothing needs restarting.

context.properties.rules = [
    {   matches = [ { application.process.binary = "xdg-desktop-portal" } ]
        actions = { update-props = { module.rt = false } }
    }
]
