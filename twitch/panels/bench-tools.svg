<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <!-- Twitch info-panel header for the bench tools panel. Render: rsvg-convert -w 320 -h 100 bench-tools.svg -o bench-tools.png -->
  <rect x="1" y="1" width="318" height="98" rx="10" fill="#14284a" stroke="#e0a630" stroke-width="2"/>
  <!-- trace from the shop logo: flat, a pulse, flat -->
  <polyline points="16,50 34,50 40,40 46,62 53,28 59,58 64,50 82,50" fill="none" stroke="#e0a630" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="16" cy="50" r="3.5" fill="#e0a630"/>
  <circle cx="82" cy="50" r="3.5" fill="#e0a630"/>
  <text x="96" y="52" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="bold" font-size="27" letter-spacing="0.5" fill="#ffffff">BENCH TOOLS</text>
  <text x="97" y="72" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="0.3" fill="#7fd3e0">built for this bench · open source</text>
  <!-- the HUD's meter colours: voltage, current, power -->
  <rect x="97" y="80" width="62" height="5" rx="2.5" fill="#f2d24b"/>
  <rect x="164" y="80" width="62" height="5" rx="2.5" fill="#5fd0dc"/>
  <rect x="231" y="80" width="62" height="5" rx="2.5" fill="#e67fd2"/>
</svg>
